services:
  c-lab:
    image: ${C_LAB_IMAGE:-c-lab:local}
    build:
      context: .
      target: runtime
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-8000}:8000"
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      STATIC_ROOT: /app/dist
      DISCOVER_LAN: "0"
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-}"
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
